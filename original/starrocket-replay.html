<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StarRocket — Flight Replay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:rgba(14,19,26,0.82);
    --border:#1f2a35;
    --text:#e8edf2;
    --muted:#5d6b7a;
    --flame:#ff5a36;
    --data:#5eead4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Space Grotesk',sans-serif;color:var(--text);}
  canvas#scene{position:fixed;inset:0;display:block;touch-action:none;}

  .hud-header{position:fixed;top:14px;left:14px;z-index:10;display:flex;align-items:center;gap:10px;}
  .mark{width:26px;height:26px;flex:none;}
  .hud-header h1{font-size:17px;letter-spacing:0.16em;margin:0;font-weight:700;}
  .hud-header p{margin:2px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:0.04em;}

  #telemetry{position:fixed;top:14px;right:14px;z-index:10;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:10px 14px;
    backdrop-filter:blur(6px);min-width:188px;}
  #telemetry .row{display:flex;justify-content:space-between;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);}
  #telemetry .row:last-child{border-bottom:none;}
  #telemetry .label{color:var(--muted);letter-spacing:0.05em;}
  #telemetry .value{color:var(--data);font-weight:500;}
  #telemetry .value.phase{color:var(--flame);font-weight:700;letter-spacing:0.08em;}

  #graph-panel{position:fixed;left:14px;bottom:74px;z-index:10;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:8px 8px 4px;
    backdrop-filter:blur(6px);}
  #graph-panel .glabel{font-size:9.5px;color:var(--muted);letter-spacing:0.12em;
    margin:0 0 4px;font-family:'JetBrains Mono',monospace;}

  #controls{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--panel);
    border-top:1px solid var(--border);backdrop-filter:blur(6px);
    padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  button{background:transparent;border:1px solid var(--border);color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:12px;padding:7px 12px;
    border-radius:6px;cursor:pointer;letter-spacing:0.04em;transition:.15s;}
  button:hover{border-color:var(--data);color:var(--data);}
  button.active{background:var(--data);color:#06231e;border-color:var(--data);}
  #speedGroup{display:flex;gap:4px;}
  input[type=range]{flex:1;accent-color:var(--data);min-width:90px;}
  .time-readout{font-family:'JetBrains Mono',monospace;font-size:11.5px;
    color:var(--muted);min-width:108px;text-align:right;white-space:nowrap;}
  .hint{position:fixed;bottom:74px;right:14px;z-index:10;font-size:10px;
    color:var(--muted);letter-spacing:0.05em;font-family:'JetBrains Mono',monospace;
    text-align:right;}

  @media (max-width:640px){
    #telemetry{min-width:150px;font-size:10.5px;}
    #telemetry .row{font-size:10.5px;}
    #graph-panel{display:none;}
    .hint{display:none;}
    .hud-header h1{font-size:14px;}
    .time-readout{min-width:84px;font-size:10px;}
    button{padding:6px 8px;font-size:11px;}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud-header">
    <svg class="mark" viewBox="0 0 24 24" fill="none">
      <path d="M12 1 L17 14 L12 11 L7 14 Z" fill="#e8edf2"/>
      <path d="M12 11 L12 23 L9 20 L9 16 Z" fill="#ff5a36"/>
      <path d="M12 11 L12 23 L15 20 L15 16 Z" fill="#5eead4" opacity="0.7"/>
    </svg>
    <div>
      <h1>STARROCKET // FLIGHT REPLAY</h1>
      <p>Trajectory + attitude (IMU) — sample data, demo build</p>
    </div>
  </div>

  <aside id="telemetry">
    <div class="row"><span class="label">PHASE</span><span class="value phase" id="t-phase">—</span></div>
    <div class="row"><span class="label">T+</span><span class="value" id="t-time">0.00 s</span></div>
    <div class="row"><span class="label">ALT (Z)</span><span class="value" id="t-alt">0 m</span></div>
    <div class="row"><span class="label">VERT SPEED</span><span class="value" id="t-vspeed">0.0 m/s</span></div>
    <div class="row"><span class="label">POS X / Y</span><span class="value" id="t-pos">0 / 0 m</span></div>
    <div class="row"><span class="label">PITCH</span><span class="value" id="t-pitch">0.0°</span></div>
    <div class="row"><span class="label">ROLL</span><span class="value" id="t-roll">0.0°</span></div>
    <div class="row"><span class="label">YAW</span><span class="value" id="t-yaw">0.0°</span></div>
  </aside>

  <div id="graph-panel">
    <p class="glabel">ALTITUDE / TIME</p>
    <canvas id="altGraph" width="220" height="90"></canvas>
  </div>

  <div class="hint">drag — rotate view<br>scroll — zoom</div>

  <div id="controls">
    <button id="playBtn">⏸ Pause</button>
    <button id="resetBtn">⟲ Reset</button>
    <div id="speedGroup"></div>
    <input id="scrub" type="range" min="0" max="1" step="0.05" value="0" />
    <span class="time-readout" id="timeReadout">0.0 / 0.0 s</span>
    <button id="viewBtn">View: Follow</button>
  </div>

<script>
// ---------------------------------------------------------------
// 1. SAMPLE FLIGHT DATA GENERATION
// Replace this with a CSV/log loader from your flight computer:
// each frame needs { t, x, y, alt, pitch, roll, yaw } where
// x/y/alt come from GPS or integrated accel, and pitch/roll/yaw
// come from the gyroscope / IMU fusion (e.g. BNO055, MPU9250).
// ---------------------------------------------------------------
const DT = 0.04;
const SCALE = 0.045; // meters -> scene units

function generateFlightData(){
  const v0 = 180, g = 9.81;
  const tBurnout = 2.0;
  const tcApogee = v0 / g;
  const tApogee = tBurnout + tcApogee;
  const mainDeployAlt = 300;

  const frames = [];
  let t = 0, alt = 0, x = 0, y = 0, rollAccum = 0;
  let mainDeployed = false, mainDeployTime = 0, mainVx0 = 0, mainVy0 = 0;

  for(;;){
    let phase, vAlt, pitch, rollRate, yaw, vx, vy;

    if (t < tBurnout) {
      phase = 'BOOST';
      const p = t / tBurnout;
      vAlt = v0 * p;
      pitch = 4 + 1.2 * Math.sin(t * 9);
      rollRate = 600 * p;
      yaw = 1.5 * Math.sin(t * 5);
      vx = 0.4 * p;
      vy = 0.25 * p;
    } else if (t < tApogee) {
      phase = 'COAST';
      const tc = t - tBurnout;
      vAlt = v0 - g * tc;
      pitch = 4 + 3 * Math.sin(tc * 0.6) * Math.exp(-tc * 0.04);
      rollRate = 600 * Math.exp(-tc * 0.12);
      yaw = 2 * Math.sin(tc * 0.35);
      vx = 0.4 + 0.18 * tc;
      vy = 0.25 + 0.12 * tc;
    } else if (!mainDeployed) {
      phase = 'DROGUE';
      const td = t - tApogee;
      vAlt = -25 * Math.min(1, td / 3);
      pitch = 4 + 88 * Math.min(1, td / 4) + 8 * Math.sin(td * 0.9);
      rollRate = 66.5 * Math.exp(-td * 0.3) + 3 * Math.sin(td * 0.8);
      yaw = 4 * Math.sin(td * 0.25);
      vx = 3.7 + 0.05 * td;
      vy = 2.45 + 0.04 * td;

      if (alt <= mainDeployAlt && vAlt < 0) {
        mainDeployed = true;
        mainDeployTime = t;
        mainVx0 = vx;
        mainVy0 = vy;
      }
    } else {
      phase = 'MAIN';
      const tm = t - mainDeployTime;
      vAlt = -6 - 14 * Math.exp(-tm * 1.2);
      pitch = 25 + 15 * Math.sin(tm * 0.7) * Math.exp(-tm * 0.05);
      rollRate = 2 * Math.sin(tm * 0.6);
      yaw = 3 * Math.sin(tm * 0.2);
      vx = mainVx0 + 0.02 * tm;
      vy = mainVy0 + 0.015 * tm;
    }

    rollAccum += rollRate * DT;

    frames.push({
      t: t,
      x: x,
      y: y,
      alt: Math.max(alt, 0),
      pitch: pitch,
      roll: rollAccum,
      yaw: yaw,
      vAlt: vAlt,
      phase: phase
    });

    if (phase === 'MAIN' && alt <= 0) break;
    if (t > 240) break;

    alt += vAlt * DT;
    x += vx * DT;
    y += vy * DT;
    t += DT;
  }

  if (frames.length) frames[frames.length - 1].alt = 0;
  return frames;
}

const frames = generateFlightData();
const totalDuration = frames[frames.length - 1].t;
const maxAlt = Math.max.apply(null, frames.map(f => f.alt));

// downsampled points for the altitude/time mini-graph
const graphPoints = [];
for (let i = 0; i < frames.length; i += 12) {
  graphPoints.push(frames[i]);
}
graphPoints.push(frames[frames.length - 1]);

function sampleFrame(time){
  const idx = time / DT;
  const i0c = Math.max(0, Math.min(frames.length - 1, Math.floor(idx)));
  const i1c = Math.min(frames.length - 1, i0c + 1);
  const f0 = frames[i0c], f1 = frames[i1c];
  const a = Math.min(1, Math.max(0, idx - i0c));
  const lerp = (p, q) => p + (q - p) * a;
  return {
    t: time,
    x: lerp(f0.x, f1.x),
    y: lerp(f0.y, f1.y),
    alt: lerp(f0.alt, f1.alt),
    pitch: lerp(f0.pitch, f1.pitch),
    yaw: lerp(f0.yaw, f1.yaw),
    roll: lerp(f0.roll, f1.roll),
    vAlt: lerp(f0.vAlt, f1.vAlt),
    phase: f0.phase
  };
}

// ---------------------------------------------------------------
// 2. THREE.JS SCENE
// ---------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.Fog(0x0a0e14, 60, 260);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);

scene.add(new THREE.AmbientLight(0x44506a, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(60, 90, 40);
scene.add(sun);

// ground + grid
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(320, 320),
  new THREE.MeshStandardMaterial({ color: 0x0d1620, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.GridHelper(320, 32, 0x223040, 0x152030));

// launch pad marker
const pad = new THREE.Mesh(
  new THREE.CylinderGeometry(0.6, 0.8, 0.3, 16),
  new THREE.MeshStandardMaterial({ color: 0xff5a36, roughness: 0.5 })
);
pad.position.y = 0.15;
scene.add(pad);

// stars
(function addStars(){
  const count = 1200;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 150 + Math.random() * 100;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.48;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi) + 10;
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0x8899aa, size: 0.6, transparent: true, opacity: 0.55 });
  scene.add(new THREE.Points(geo, mat));
})();

// rocket model
function buildRocket(){
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8edf2, metalness: 0.25, roughness: 0.5 });
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xff5a36, metalness: 0.2, roughness: 0.4 });
  const finMat  = new THREE.MeshStandardMaterial({ color: 0x1f2a35, metalness: 0.4, roughness: 0.6 });

  const bodyHeight = 3.2, bodyRadius = 0.28;

  const body = new THREE.Mesh(new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyHeight, 16), bodyMat);
  body.position.y = bodyHeight / 2;
  group.add(body);

  const noseHeight = 0.9;
  const nose = new THREE.Mesh(new THREE.ConeGeometry(bodyRadius, noseHeight, 16), noseMat);
  nose.position.y = bodyHeight + noseHeight / 2;
  group.add(nose);

  for (let i = 0; i < 3; i++) {
    const pivot = new THREE.Group();
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.7, 0.55), finMat);
    fin.position.set(bodyRadius + 0.05, 0.35, 0);
    pivot.add(fin);
    pivot.rotation.y = (i / 3) * Math.PI * 2;
    group.add(pivot);
  }

  // boost flame
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(bodyRadius * 0.85, 1.2, 12),
    new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.85 })
  );
  flame.rotation.x = Math.PI; // point downward
  flame.position.y = -0.6;
  flame.visible = false;
  group.add(flame);
  group.userData.flame = flame;

  return group;
}

const rocket = buildRocket();
scene.add(rocket);

// trajectory line (full faint path + bright traveled path)
const linePositions = new Float32Array(frames.length * 3);
for (let i = 0; i < frames.length; i++) {
  linePositions[i*3]   = frames[i].x * SCALE;
  linePositions[i*3+1] = frames[i].alt * SCALE;
  linePositions[i*3+2] = frames[i].y * SCALE;
}

const fullGeo = new THREE.BufferGeometry();
fullGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
scene.add(new THREE.Line(fullGeo, new THREE.LineBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.16 })));

const travGeo = new THREE.BufferGeometry();
travGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
travGeo.setDrawRange(0, 1);
const travLine = new THREE.Line(travGeo, new THREE.LineBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.95 }));
scene.add(travLine);

// bounding box for overview camera
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity;
for (let i = 0; i < frames.length; i++) {
  const px = frames[i].x * SCALE, py = frames[i].alt * SCALE, pz = frames[i].y * SCALE;
  if (px<minX) minX=px; if (px>maxX) maxX=px;
  if (py<minY) minY=py; if (py>maxY) maxY=py;
  if (pz<minZ) minZ=pz; if (pz>maxZ) maxZ=pz;
}
const overviewCenter = new THREE.Vector3((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
const overviewDiag = Math.sqrt((maxX-minX)**2 + (maxY-minY)**2 + (maxZ-minZ)**2);

// ---------------------------------------------------------------
// 3. CAMERA CONTROLS (drag to orbit, scroll to zoom)
// ---------------------------------------------------------------
let mode = 'follow'; // 'follow' | 'overview'
let azimuth = Math.PI * 0.25, elevation = Math.PI * 0.22, radius = 13;

function applyViewPreset(){
  if (mode === 'follow') {
    radius = 13; elevation = Math.PI * 0.22;
  } else {
    radius = Math.max(overviewDiag * 0.85, 20); elevation = Math.PI * 0.28;
  }
}

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointercancel', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  azimuth -= dx * 0.005;
  elevation = Math.max(0.05, Math.min(Math.PI/2 - 0.03, elevation + dy * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  const maxR = Math.max(overviewDiag * 1.5, 40);
  radius = Math.max(4, Math.min(maxR, radius + e.deltaY * 0.02));
  e.preventDefault();
}, { passive: false });

function updateCamera(target){
  const cx = target.x + radius * Math.cos(elevation) * Math.sin(azimuth);
  const cy = target.y + radius * Math.sin(elevation);
  const cz = target.z + radius * Math.cos(elevation) * Math.cos(azimuth);
  camera.position.set(cx, cy, cz);
  camera.lookAt(target.x, target.y, target.z);
}

// ---------------------------------------------------------------
// 4. UI WIRING
// ---------------------------------------------------------------
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const viewBtn = document.getElementById('viewBtn');
const scrub = document.getElementById('scrub');
const timeReadout = document.getElementById('timeReadout');
const speedGroup = document.getElementById('speedGroup');

scrub.max = totalDuration.toFixed(2);
scrub.step = (DT * 4).toFixed(2);

let playing = true;
let speed = 4;
let simTime = 0;

[0.5, 1, 2, 4, 8].forEach(s => {
  const b = document.createElement('button');
  b.textContent = s + 'x';
  if (s === speed) b.classList.add('active');
  b.addEventListener('click', () => {
    speed = s;
    speedGroup.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
  speedGroup.appendChild(b);
});

function setPlaying(v){
  playing = v;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
}

playBtn.addEventListener('click', () => {
  if (!playing && simTime >= totalDuration - 1e-6) simTime = 0;
  setPlaying(!playing);
});

resetBtn.addEventListener('click', () => {
  simTime = 0;
  scrub.value = 0;
  setPlaying(true);
});

scrub.addEventListener('input', () => {
  simTime = parseFloat(scrub.value);
  setPlaying(false);
});

viewBtn.addEventListener('click', () => {
  mode = (mode === 'follow') ? 'overview' : 'follow';
  viewBtn.textContent = 'View: ' + (mode === 'follow' ? 'Follow' : 'Overview');
  applyViewPreset();
});
applyViewPreset();

// ---------------------------------------------------------------
// 5. TELEMETRY + GRAPH
// ---------------------------------------------------------------
const elPhase = document.getElementById('t-phase');
const elTime = document.getElementById('t-time');
const elAlt = document.getElementById('t-alt');
const elVSpeed = document.getElementById('t-vspeed');
const elPos = document.getElementById('t-pos');
const elPitch = document.getElementById('t-pitch');
const elRoll = document.getElementById('t-roll');
const elYaw = document.getElementById('t-yaw');

function updateTelemetry(f){
  elPhase.textContent = f.phase;
  elTime.textContent = f.t.toFixed(2) + ' s';
  elAlt.textContent = f.alt.toFixed(0) + ' m';
  elVSpeed.textContent = (f.vAlt >= 0 ? '+' : '') + f.vAlt.toFixed(1) + ' m/s';
  elPos.textContent = f.x.toFixed(0) + ' / ' + f.y.toFixed(0) + ' m';
  elPitch.textContent = f.pitch.toFixed(1) + '°';
  elRoll.textContent = (((f.roll % 360) + 360) % 360).toFixed(1) + '°';
  elYaw.textContent = f.yaw.toFixed(1) + '°';
  timeReadout.textContent = f.t.toFixed(1) + ' / ' + totalDuration.toFixed(1) + ' s';
}

const gctx = document.getElementById('altGraph').getContext('2d');
function drawGraph(time){
  const W = 220, H = 90, pad = 6;
  gctx.clearRect(0, 0, W, H);
  gctx.strokeStyle = '#5eead4';
  gctx.globalAlpha = 0.35;
  gctx.lineWidth = 1.5;
  gctx.beginPath();
  for (let i = 0; i < graphPoints.length; i++) {
    const gp = graphPoints[i];
    const px = (gp.t / totalDuration) * (W - pad*2) + pad;
    const py = H - pad - (gp.alt / maxAlt) * (H - pad*2);
    if (i === 0) gctx.moveTo(px, py); else gctx.lineTo(px, py);
  }
  gctx.stroke();
  gctx.globalAlpha = 1;

  const f = sampleFrame(time);
  const mx = (time / totalDuration) * (W - pad*2) + pad;
  const my = H - pad - (f.alt / maxAlt) * (H - pad*2);
  gctx.strokeStyle = '#ff5a36';
  gctx.lineWidth = 1;
  gctx.beginPath(); gctx.moveTo(mx, 0); gctx.lineTo(mx, H); gctx.stroke();
  gctx.fillStyle = '#ff5a36';
  gctx.beginPath(); gctx.arc(mx, my, 3, 0, Math.PI * 2); gctx.fill();
}

// ---------------------------------------------------------------
// 6. ANIMATION LOOP
// ---------------------------------------------------------------
let lastNow = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const delta = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;

  if (playing) {
    simTime += delta * speed;
    if (simTime >= totalDuration) {
      simTime = totalDuration;
      setPlaying(false);
    }
    scrub.value = simTime;
  }

  const f = sampleFrame(simTime);

  rocket.position.set(f.x * SCALE, f.alt * SCALE, f.y * SCALE);
  rocket.rotation.x = THREE.MathUtils.degToRad(f.pitch);
  rocket.rotation.z = THREE.MathUtils.degToRad(f.yaw);
  rocket.rotation.y = THREE.MathUtils.degToRad(f.roll);
  rocket.userData.flame.visible = (f.phase === 'BOOST');
  if (f.phase === 'BOOST') {
    rocket.userData.flame.scale.set(1, 0.75 + Math.random() * 0.5, 1);
  }

  const idx = Math.min(frames.length - 1, Math.floor(simTime / DT));
  travGeo.setDrawRange(0, Math.max(2, idx + 1));

  const target = (mode === 'follow') ? rocket.position : overviewCenter;
  updateCamera(target);

  updateTelemetry(f);
  drawGraph(simTime);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

requestAnimationFrame(animate);
</script>
</body>
</html>
