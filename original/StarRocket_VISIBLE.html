<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StarRocket — High Visibility Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #1a202c; font-family: sans-serif; color: white; }
  canvas { display: block; }
  #info { position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; display: flex; gap: 10px; align-items: center; }
  button { padding: 8px 15px; cursor: pointer; background: #4a5568; color: white; border: none; border-radius: 5px; }
  button:hover { background: #718096; }
</style>
</head>
<body>
  <div id="info">
    <h1 style="margin:0; font-size: 24px;">STARROCKET DEMO</h1>
    <p id="phase" style="color: #63b3ed; font-weight: bold; font-size: 18px;">INITIALIZING...</p>
    <p id="telemetry">ALTITUDE: 0m | SPEED: 0m/s</p>
  </div>
  <div id="controls">
    <button onclick="toggleDemo()">TOGGLE AUTO-ROTATE</button>
    <button onclick="resetSim()">RESET</button>
    <span id="timer">0.0s</span>
  </div>
  <script>
    const DT = 0.04;
    const SCALE = 0.045;
    
    // Simple Data Gen
    function generateData() {
      const frames = [];
      for(let t=0; t<30; t+=DT) {
        let alt = 150 * t - 4.9 * t * t;
        if (alt < 0 && t > 1) break;
        frames.push({ t, alt: Math.max(0, alt), phase: t < 2 ? 'BOOST' : (t < 15 ? 'COAST' : 'DESCENT') });
      }
      return frames;
    }
    const frames = generateData();
    let simTime = 0;
    let autoRotate = true;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a202c); // Lighter blue-grey
    
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(20, 15, 20);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 1.0)); // Very bright ambient
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(10, 20, 10);
    scene.add(sun);

    // Rocket
    const rocket = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 4, 16), new THREE.MeshStandardMaterial({color: 0xffffff}));
    body.position.y = 2;
    rocket.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 16), new THREE.MeshStandardMaterial({color: 0xff0000}));
    nose.position.y = 4.5;
    rocket.add(nose);
    scene.add(rocket);

    // Ground
    const ground = new THREE.GridHelper(100, 20, 0x4a5568, 0x2d3748);
    scene.add(ground);

    function toggleDemo() { autoRotate = !autoRotate; }
    function resetSim() { simTime = 0; }

    function animate() {
      requestAnimationFrame(animate);
      
      simTime += 0.02;
      const idx = Math.min(frames.length - 1, Math.floor((simTime % 30) / DT));
      const f = frames[idx];
      
      rocket.position.y = f.alt * SCALE;
      
      if (autoRotate) {
        const angle = Date.now() * 0.001;
        camera.position.x = rocket.position.x + 25 * Math.cos(angle);
        camera.position.z = rocket.position.z + 25 * Math.sin(angle);
        camera.position.y = rocket.position.y + 10;
        camera.lookAt(rocket.position);
      }

      document.getElementById('phase').innerText = f.phase;
      document.getElementById('timer').innerText = f.t.toFixed(1) + 's';
      document.getElementById('telemetry').innerText = `ALTITUDE: ${f.alt.toFixed(0)}m`;
      
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
